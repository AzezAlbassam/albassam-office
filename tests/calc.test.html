<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calc tests — Albassam</title>
<style>body{font:14px/1.6 monospace;background:#11302F;color:#EDE6D8;padding:24px}
.pass{color:#7FD6C4}.fail{color:#E08A6B}h1{font-size:16px}</style>
</head>
<body>
<h1>Sluice math — test run</h1>
<div id="out"></div>
<script type="module">
import * as C from '../js/calc.js';

const out = document.getElementById('out');
let passed = 0, failed = 0;
function t(name, fn) {
  try { fn(); passed++; out.insertAdjacentHTML('beforeend', `<div class="pass">PASS ${name}</div>`); }
  catch (e) { failed++; out.insertAdjacentHTML('beforeend', `<div class="fail">FAIL ${name} — ${e.message}</div>`); console.error(name, e); }
}
const close = (a, b, tol, label) => { if (Math.abs(a - b) > tol) throw new Error(`${label || ''} expected ~${b}±${tol}, got ${a}`); };

// One member owning everything, $100,000 contributed.
const state = {
  marketValueCents: 10000000, totalUnitsMicro: 100000 * 1e6, fxRate: 3.75, zakatPct: 2.5,
  members: [{ id: 'a', name: 'A', unitsMicro: 100000 * 1e6, netContributedCents: 10000000 }],
};
const plan = (mix, extra) => ({ ...C.defaultPlan(), base: 'put', mix: {
  saudi: { alloc: 0, yieldPct: 0 }, us: { alloc: 0, yieldPct: 0 }, sukuk: { alloc: 0, yieldPct: 0 }, cash: { alloc: 0, yieldPct: 0 }, ...mix },
  members: { a: { zakatMethod: 'none' } }, ...extra });

t('$100k at 5% Saudi pays SAR 1,562.50 a month', () => {
  const s = C.salaries(state, plan({ saudi: { alloc: 100, yieldPct: 5 } }))[0];
  close(s.netUSD, 416.6667, 0.001); close(s.netSAR, 1562.5, 0.001);
});
t('$100k at 5% US pays SAR 1,093.75 after the 30% cut', () => {
  const s = C.salaries(state, plan({ us: { alloc: 100, yieldPct: 5 } }))[0];
  close(s.netSAR, 1093.75, 0.001); close(s.taxSAR, 468.75, 0.001);
});
t('50/50 Saudi 5.27 + SCHD 3.17 blends to 4.22% gross, 3.7445% net', () => {
  const y = C.blended(plan({ saudi: { alloc: 50, yieldPct: 5.27 }, us: { alloc: 50, yieldPct: 3.17 } }));
  close(y.gross * 100, 4.22, 1e-9); close(y.net * 100, 3.7445, 1e-9);
});
t('SAR 5,000 a month at 5% Saudi needs SAR 1.20M', () => {
  const p = plan({ saudi: { alloc: 100, yieldPct: 5 } });
  close(C.capitalNeeded(state, p, 'a', 5000) * 3.75, 1200000, 0.01);
});
t('SAR 5,000 a month at 5% US needs SAR 1.714M', () => {
  const p = plan({ us: { alloc: 100, yieldPct: 5 } });
  close(C.capitalNeeded(state, p, 'a', 5000) * 3.75, 1714285.714, 0.01);
});
t('US capital penalty at 30% is 42.86%', () => close(C.capitalPenaltyPct(plan({})), 42.857, 0.001));
t('Full-value zakat on a US slice, Hijri: 2.5% a year', () => {
  const p = plan({ us: { alloc: 100, yieldPct: 5 } }, { members: { a: { zakatMethod: 'full' } } });
  close(C.zakatAnnual(p, 100000, C.memberPlan(p, 'a')), 2500, 1e-9);
});
t('Gregorian rate is 2.5777%', () => close(C.GREGORIAN_RATE * 100, 2.5777, 0.0001));
t('Zakatable-assets method at 30% is 0.75% of value', () => {
  const p = plan({ us: { alloc: 100, yieldPct: 5 } }, { members: { a: { zakatMethod: 'assets', zakatK: 30 } } });
  close(C.zakatAnnual(p, 100000, C.memberPlan(p, 'a')), 750, 1e-9);
});
t('Saudi shares owe no extra zakat when the company pays', () => {
  const p = plan({ saudi: { alloc: 100, yieldPct: 5 } }, { members: { a: { zakatMethod: 'full', saudiCompanyPays: true } } });
  close(C.zakatAnnual(p, 100000, C.memberPlan(p, 'a')), 0, 1e-9);
});
t('Cash is always zakatable at full value', () => {
  const p = plan({ cash: { alloc: 100, yieldPct: 0 } }, { members: { a: { zakatMethod: 'assets' } } });
  close(C.zakatAnnual(p, 100000, C.memberPlan(p, 'a')), 2500, 1e-9);
});
t('When zakat beats the yield, the capital needed is infinite', () => {
  const p = plan({ us: { alloc: 100, yieldPct: 0.98 } }, { members: { a: { zakatMethod: 'full' } } });
  if (C.capitalNeeded(state, p, 'a', 5000) !== Infinity) throw new Error('expected Infinity');
});
t('A 30% cut lowers the floor by exactly 30%', () => {
  const p = plan({ saudi: { alloc: 100, yieldPct: 5 } }, { cutPct: { saudi: 30, us: 0, sukuk: 0, cash: 0 } });
  close(C.floorSalaries(state, p)[0].netSAR, 1562.5 * 0.7, 0.001);
});
t('Salaries across members add up to the pool (three members, base now)', () => {
  const st = { marketValueCents: 1336349, totalUnitsMicro: 269473e6, fxRate: 3.75, zakatPct: 2.5, members: [
    { id: 'a', name: 'Aziz', unitsMicro: 144991e6, netContributedCents: 14499100 },
    { id: 'm', name: 'Mom', unitsMicro: 108442e6, netContributedCents: 10844200 },
    { id: 't', name: 'Turki', unitsMicro: 16040e6, netContributedCents: 1604000 }] };
  const p = { ...plan({ saudi: { alloc: 100, yieldPct: 5 } }), base: 'now', members: {} };
  p.members = { a: { zakatMethod: 'none' }, m: { zakatMethod: 'none' }, t: { zakatMethod: 'none' } };
  const sum = C.salaries(st, p).reduce((a, s) => a + s.netUSD, 0);
  close(sum, 13363.49 * 0.05 / 12, 0.0001);
});
t('An allowance under the earnings never runs dry', () => {
  const p = plan({ saudi: { alloc: 100, yieldPct: 5 } }, { growthPct: 0 });
  if (C.monthsUntilDry(100000, p, 1000, 3.75) !== Infinity) throw new Error('expected Infinity');
});
t('An allowance over the earnings runs dry in finite time', () => {
  const p = plan({ saudi: { alloc: 100, yieldPct: 5 } }, { growthPct: 0 });
  const m = C.monthsUntilDry(100000, p, 5000, 3.75);
  if (!Number.isFinite(m) || m < 12) throw new Error('got ' + m);
});
t('Reinvesting never pays less than spending', () => {
  const rows = C.snowball(100000, plan({ saudi: { alloc: 100, yieldPct: 5 } }), 3.75);
  rows.forEach((r) => { if (r.growSAR + 1e-9 < r.spendSAR) throw new Error('year ' + r.year); });
  if (rows[rows.length - 1].growSAR <= rows[0].growSAR) throw new Error('snowball did not grow');
});
t('Base "custom" splits the typed amount by units', () => {
  const p = { ...plan({ saudi: { alloc: 100, yieldPct: 5 } }), base: 'custom', customUSD: 500000 };
  close(C.slices(state, p)[0].usd, 500000, 1e-9);
});

// ---- fixes from the independent review ----
const mixed = () => ({ ...plan({ saudi: { alloc: 50, yieldPct: 5 }, us: { alloc: 50, yieldPct: 3.17 } }), members: { a: { zakatMethod: 'assets', zakatK: 30 } } });
t('Spend-it year 0 equals the payslip (zakat included)', () => {
  const p = mixed();
  const pay = C.salaries(state, p)[0].netSAR;
  const row = C.snowball(100000, p, 3.75, C.zakatPerGregYear(p, 1, C.memberPlan(p, 'a')))[0];
  close(row.spendSAR, pay, 1e-6);
});
t('An allowance just above the after-zakat payslip runs dry', () => {
  const p = { ...mixed(), growthPct: 0 };
  const pay = C.salaries(state, p)[0].netSAR;
  const m = C.monthsUntilDry(100000, p, pay + 20, 3.75, C.zakatPerGregYear(p, 1, C.memberPlan(p, 'a')));
  if (!Number.isFinite(m)) throw new Error('expected a finite number of months');
});
t('Taking exactly the payslip at zero growth never runs dry', () => {
  const p = { ...plan({ saudi: { alloc: 100, yieldPct: 5 } }), growthPct: 0 };
  if (C.monthsUntilDry(100000, p, 1562.5, 3.75) !== Infinity) throw new Error('expected Infinity');
});
t('Depletion beyond 100 years is still finite', () => {
  const p = { ...plan({ saudi: { alloc: 100, yieldPct: 5 } }), growthPct: 0 };
  const m = C.monthsUntilDry(100000, p, 1563, 3.75);
  if (!Number.isFinite(m) || m < 1200) throw new Error('got ' + m);
});
t('Sukuk benchmark is after zakat: Saudi mix at 5% beats 5.53% sukuk under full zakat', () => {
  const p = { ...plan({ saudi: { alloc: 100, yieldPct: 5 } }), sukukBenchPct: 5.53, members: { a: { zakatMethod: 'full', saudiCompanyPays: true } } };
  const mix = C.salaries(state, p)[0].netSAR;
  const suk = C.benchmarkMonthlySAR(100000, p, 3.75, C.memberPlan(p, 'a'));
  if (!(mix > suk)) throw new Error(`mix ${mix} vs sukuk ${suk}`);
});
t('Monthly zakat set-aside is the same on Hijri and Gregorian bases', () => {
  const base = { ...plan({ cash: { alloc: 100, yieldPct: 0 } }), members: { a: { zakatMethod: 'full' } } };
  const h = C.salaries(state, { ...base, rateBasis: 'hijri' })[0].zakatUSD;
  const g = C.salaries(state, { ...base, rateBasis: 'gregorian' })[0].zakatUSD;
  close(h, g, 1e-9); close(h, 100000 * C.GREGORIAN_RATE / 12, 1e-9);
});
t('A member with zero units gets nothing on the money-put-in base', () => {
  const st = { ...state, members: [...state.members, { id: 'z', name: 'Z', unitsMicro: 0, netContributedCents: 500000 }] };
  close(C.slices(st, plan({})).find((x) => x.id === 'z').usd, 0, 0);
});
t('Allocations like 33.3 + 33.3 + 33.4 count as 100%', () => {
  const p = plan({ saudi: { alloc: 33.3, yieldPct: 5 }, us: { alloc: 33.3, yieldPct: 3 }, sukuk: { alloc: 33.4, yieldPct: 3.69 } });
  if (!C.allocOk(p)) throw new Error('total ' + C.allocTotal(p));
});

out.insertAdjacentHTML('beforeend', `<h1>${passed} passed, ${failed} failed</h1>`);
document.title = failed ? `✗ ${failed} FAILED` : `✓ all ${passed} passed`;
</script>
</body>
</html>
